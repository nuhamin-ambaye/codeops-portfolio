<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habesha Eatery Landing Page</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 1;
      }
    </style>
  </head>

  <body>
    <form
      action="submit"
      method="post"
      style="background-color: rgb(82, 172, 217)"
      ;
    >
      <p>
        <label for="full_name">Full name</label>
        <input
          id="full_name"
          type="name"
          placeholder="Abebe Kebede"
          pattern="[A-Za-z]+\+[A-Za-z]"
          style="text-transform: capitalize"
        />
      </p>
      <p>
        <label for="phone_number">Phone number</label>
        <input
          id="phone_number"
          type="tel"
          pattern="^(09|\+251)[0-9]{8}"
          placeholder="0911223344"
          required
        />
      </p>
      <p>
        <label for="guests">Guest(s)</label>
        <input
          id="guests"
          type="number"
          placeholder="2"
          pattern="[0-9]{2}"
          min="1"
          max="10"
          required
        />
      </p>
      <p>
        <label for="booking-date">Date</label>
        <input
          id="booking-date"
          type="text"
          placeholder="dd-yy-yyyy"
          pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}"
          required
        />
      </p>
      <button action="sumbit" style="display: block; margin: 0 auto">
        Submit
      </button>
    </form>
  </body>
</html>
