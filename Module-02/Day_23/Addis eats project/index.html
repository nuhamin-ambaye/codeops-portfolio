<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="png" sizes="32x32" href="/Module-02/Day_23/Pictures/Addis eats logo.png">
    <title>Addis eats</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
<div id="body-wrapper">
    <header id="header">
        <nav id="nav-bar">
            <div class="logo-image">
                <img src="/Module-02/Day_23/Addis eats project/Pictures/Addis eats logo.png" alt="Addis eats logo" class="logo-image">
            </div>
            
            <h3>Addis eats</h3>
            <div id="navs">
                <a href="#hero">Home</a>
                <a href="#menu-and-search">Menu</a>
                <a href="about.html">About</a>
            </div>
        </nav>
    </header>

    <main id="main-content">
        <section id="hero">
            <div id="hero-card">
                <h1>Delicious Ethiopian food, <br>made for you</h1>
                <p>Discover authentic Ethiopian dishes and order <br>your favorites with Addis Eats.</p><br>
                <a id="hero-btn" class="btn" href="#menu-and-search">Explore menu</a> 
            </div>
        </section>
        
        <section id="menu-and-search">
            <h2>Our menu</h2>
            <input type="text" id="search-bar" placeholder="Search dishes">
        </section>

        <div id="menu-and-cart">
            <section id="menu">

            </section>

            <aside id="cart-and-cktform">
                <div id="cart">
                    <h2>Your order</h2>
                    <p id="cart-error-message"></p>
                    <div id="cart-items"></div>

                    <div id="total">
                        <h3 class="total-label">Total:</h3>
                        <h3 class="total-price" id="cart-total-val">0 ETB</h3>
                    </div>
                    <button id="checkout-btn">CHECKOUT</button>
                </div>

                <div id="checkout-form">
                    <form id="form" novalidate>
                        <h2>Confirmation details</h2>
                        <div id="name-row">
                            <div class="input-grp">
                                <input id="fname" type="text" placeholder="First name">
                                <p id="fname-error" class="error-msg"></p>
                            </div>
                            <div class="input-grp">
                                <input id="lname" type="text" placeholder="Last name">
                                <p id="lname-error" class="error-msg"></p>
                            </div>
                        </div>
                        <input id="pnumber" type="tel" placeholder="(+251/0)911223344">
                        <p id="pnumber-error" class="error-msg"></p>
                        <input id="email" type="email" placeholder="abebekebede@gmail.com">
                        <p id="email-error" class="error-msg"></p>
                        <button id="confirm-btn" type="submit">CONFIRM</button>
                    </form>
                </div>
            </aside>
        </div>
    </main>

    <footer id="footer">
        <p>&copy;2026 Addis Eats.</p>
        <div id="footer-links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="mailto:addiseats@gmail.com">Contact us</a>
        </div>
    </footer>
</div>

<script src="app.js"></script>
</body>
</html>
